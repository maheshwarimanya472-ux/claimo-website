name: Claimo form update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-claimo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Claimo patch
        run: python patch_claimo.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js
          git diff --cached --quiet || git commit -m "Connect Claimo enquiries to Google Sheets"
          git push
