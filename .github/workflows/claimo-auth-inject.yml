name: Inject Claimo Auth

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add auth script tag if missing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="claimo-auth.js" defer></script>'
          if tag not in s:
              marker = '<script src="script.js"></script>'
              if marker in s:
                  s = s.replace(marker, marker + '\n  ' + tag, 1)
              else:
                  s = s.replace('</body>', '  ' + tag + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit auth script tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Connect Claimo Supabase authentication"
          git push
